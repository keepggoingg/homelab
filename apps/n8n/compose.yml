# n8n (workflow automation) + Postgres.
#   private, always:  http://<HL_HOST>:5678   (LAN / Tailscale, Traefik entrypoint n8n-lan)
#   public:           https://n8n.<DOMAIN>    only once Cloudflare Access is configured (CF_ACCESS_*)
# Values come from config/compose.env (.env here links to it), generated by `bin/homelab render`.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: n8n
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n -d n8n"]
      interval: 10s
      retries: 5
    networks: [internal]

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_HOST: ${N8N_HOST}
      N8N_PROTOCOL: ${N8N_PROTOCOL}
      WEBHOOK_URL: ${N8N_BASE_URL}
      N8N_EDITOR_BASE_URL: ${N8N_BASE_URL}
      N8N_SECURE_COOKIE: ${N8N_SECURE_COOKIE}
      N8N_PROXY_HOPS: "1"
      GENERIC_TIMEZONE: ${TZ:-UTC}
      TZ: ${TZ:-UTC}
      N8N_RUNNERS_ENABLED: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "336"   # hours = 14 days
      # SSO: Cloudflare Access login -> n8n session (hooks/cf-access-sso.js)
      EXTERNAL_HOOK_FILES: /hooks/cf-access-sso.js
      CF_ACCESS_TEAM: ${CF_ACCESS_TEAM}
      CF_ACCESS_AUD: ${CF_ACCESS_AUD}
    volumes:
      - ./data/n8n:/home/node/.n8n
      - ./hooks:/hooks:ro
    mem_limit: 1g
    networks: [internal, proxy]
    labels:
      - traefik.enable=true
      # public, behind Cloudflare Access (rule points nowhere until CF_ACCESS_* are set, see lib/hlconfig.py)
      - traefik.http.routers.n8n.rule=${N8N_PUBLIC_RULE}
      - traefik.http.services.n8n.loadbalancer.server.port=5678
      - traefik.http.routers.n8n.service=n8n
      # private: anything arriving on port 5678 (published on the host, reachable from LAN / Tailscale)
      - traefik.http.routers.n8n-lan.entrypoints=n8n-lan
      - traefik.http.routers.n8n-lan.rule=PathPrefix(`/`)
      - traefik.http.routers.n8n-lan.service=n8n
      # MCP server for Claude Code over Tailscale (bearer token, no Cloudflare Access)
      - traefik.http.routers.n8n-mcp.rule=(Host(`${HL_HOST}`) || Host(`${HL_TAILSCALE_IP:-${HL_HOST}}`)) && PathPrefix(`/mcp-server`)
      - traefik.http.routers.n8n-mcp.service=n8n

networks:
  internal: {}
  proxy:
    external: true
