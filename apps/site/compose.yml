# Public static site on the apex domain ($DOMAIN): home page + privacy policy (needed by the Google OAuth app).
# apps/site/html/ is the personal overlay (gitignored); `cp -r starter html` to start one.
services:
  site:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./html:/usr/share/nginx/html:ro
    mem_limit: 32m
    networks: [proxy]
    labels:
      - traefik.enable=true
      - traefik.http.routers.site.rule=Host(`${DOMAIN:-localhost}`) || Host(`www.${DOMAIN:-localhost}`)
      - traefik.http.services.site.loadbalancer.server.port=80
networks:
  proxy:
    external: true
