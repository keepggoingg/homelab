<title>Dashboard · homelab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;500;700;800&display=swap" rel="stylesheet">
<style>
  /* Direction C "Widgets" (StandBy-like): black ground, big rounded tiles, white type. */
  :root { --u: min(100vw / 1920, 100vh / 1080); --tile: #161616; --tile2: #2a2a2a; --ink: #fff; --mute: #9a9a9a; --dim: #4a4a4a; --r: calc(44 * var(--u)); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #000; color: var(--ink); font-family: "Manrope", "Noto Sans", sans-serif; overflow: hidden; cursor: none; user-select: none; }
  .grid { height: 100%; padding: calc(40 * var(--u)); display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); grid-template-rows: repeat(2, minmax(0, 1fr)); gap: calc(24 * var(--u)); }
  .tile { background: var(--tile); border-radius: var(--r); padding: calc(40 * var(--u)); display: flex; flex-direction: column; min-width: 0; min-height: 0; overflow: hidden; }
  .wide { grid-column: span 2; }
  .head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: calc(6 * var(--u)) calc(16 * var(--u)); }
  .title { font-size: calc(26 * var(--u)); font-weight: 700; white-space: nowrap; }
  .sub { font-size: calc(22 * var(--u)); color: var(--mute); }

  .clock-tile { padding: calc(48 * var(--u)) calc(56 * var(--u)); justify-content: space-between; }
  .date { font-size: calc(30 * var(--u)); font-weight: 500; color: var(--mute); }
  .clock { font-size: calc(290 * var(--u)); font-weight: 800; line-height: .8; letter-spacing: -.041em; font-variant-numeric: tabular-nums; }

  .weather { justify-content: space-between; }
  .temp { font-size: calc(150 * var(--u)); font-weight: 300; line-height: .85; letter-spacing: -.04em; }
  .cond { font-size: calc(28 * var(--u)); font-weight: 500; }

  .music { padding: calc(32 * var(--u)); gap: calc(22 * var(--u)); }
  .cover { flex: 1; min-height: 0; border-radius: calc(26 * var(--u)); background: var(--tile2) center / cover no-repeat; }
  .track { display: flex; justify-content: space-between; align-items: center; gap: calc(16 * var(--u)); }
  .track > div { min-width: 0; }
  .t-name { font-size: calc(28 * var(--u)); font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .t-artist { font-size: calc(22 * var(--u)); color: var(--mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pp { width: calc(64 * var(--u)); height: calc(64 * var(--u)); border-radius: calc(32 * var(--u)); background: #fff; flex: none; display: flex; align-items: center; justify-content: center; }
  .prog { height: calc(5 * var(--u)); border-radius: calc(3 * var(--u)); background: var(--tile2); overflow: hidden; } .prog i { display: block; height: 100%; background: #fff; }
  .days { display: flex; flex-direction: column; gap: calc(16 * var(--u)); margin-top: calc(18 * var(--u)); }
  .day { display: grid; grid-template-columns: 1fr calc(120 * var(--u)) calc(70 * var(--u)); align-items: center; gap: calc(14 * var(--u)); font-size: calc(24 * var(--u)); }
  .day span:first-child { color: var(--mute); }
  .range { height: calc(6 * var(--u)); border-radius: calc(3 * var(--u)); background: var(--tile2); position: relative; } .range i { position: absolute; top: 0; bottom: 0; border-radius: calc(3 * var(--u)); background: #fff; }
  .day span:last-child { text-align: right; font-variant-numeric: tabular-nums; }

  .server { justify-content: space-between; }
  .rings { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: calc(12 * var(--u)); }
  .ring { display: flex; flex-direction: column; align-items: center; gap: calc(10 * var(--u)); font-size: calc(22 * var(--u)); color: var(--mute); }
  .ring .r { width: calc(116 * var(--u)); height: calc(116 * var(--u)); border-radius: calc(58 * var(--u)); display: flex; align-items: center; justify-content: center; }
  .ring .r b { width: calc(92 * var(--u)); height: calc(92 * var(--u)); border-radius: calc(46 * var(--u)); background: var(--tile); display: flex; align-items: center; justify-content: center; font-size: calc(26 * var(--u)); font-weight: 700; color: #fff; }

  .list { display: flex; flex-direction: column; gap: calc(16 * var(--u)); margin-top: calc(22 * var(--u)); }
  .row { display: flex; justify-content: space-between; align-items: baseline; gap: calc(12 * var(--u)); font-size: calc(24 * var(--u)); }
  .row span:first-child { position: relative; flex: 1 1 0; min-width: 0; padding-left: calc(26 * var(--u)); overflow-wrap: anywhere;
    display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }   /* long names wrap to 2 lines, then … */
  .row span:first-child::before { content: ""; position: absolute; left: 0; top: calc((1lh - 12 * var(--u)) / 2); width: calc(12 * var(--u)); height: calc(12 * var(--u)); border-radius: calc(6 * var(--u)); background: #fff; }
  .row.off span:first-child::before { background: var(--dim); }
  .row span:last-child { flex: none; max-width: 55%; color: var(--mute); font-size: calc(22 * var(--u)); text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .claude { padding: calc(40 * var(--u)) calc(48 * var(--u)); gap: calc(16 * var(--u)); }
  .claude .dot { width: calc(14 * var(--u)); height: calc(14 * var(--u)); border-radius: calc(7 * var(--u)); background: var(--dim); }
  .claude.live .dot { background: #fff; animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .3; } }
  .msgs { flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: flex-end; gap: calc(14 * var(--u)); overflow: hidden; -webkit-mask-image: linear-gradient(transparent, #000 calc(60 * var(--u))); }
  .msg { font-size: calc(26 * var(--u)); line-height: 1.4; max-width: calc(820 * var(--u)); white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg.user { align-self: flex-end; max-width: calc(640 * var(--u)); background: var(--tile2); border-radius: calc(26 * var(--u)) calc(26 * var(--u)) calc(8 * var(--u)) calc(26 * var(--u)); padding: calc(14 * var(--u)) calc(24 * var(--u)); }
  .msg.tool { font-size: calc(22 * var(--u)); color: var(--mute); }
  .msg.md { white-space: normal; }
  .msg.md > :first-child { margin-top: 0; } .msg.md > :last-child { margin-bottom: 0; }
  .msg.md p, .msg.md ul, .msg.md ol, .msg.md pre, .msg.md blockquote, .msg.md h4 { margin: 0 0 calc(10 * var(--u)); }
  .msg.md h4 { font-size: calc(26 * var(--u)); font-weight: 800; }
  .msg.md ul, .msg.md ol { padding-left: calc(34 * var(--u)); }
  .msg.md li + li { margin-top: calc(4 * var(--u)); }
  .msg.md strong { font-weight: 800; color: #fff; }
  .msg.md code { font-family: ui-monospace, "JetBrains Mono", monospace; font-size: .85em; background: var(--tile2); border-radius: calc(6 * var(--u)); padding: 0 calc(6 * var(--u)); }
  .msg.md pre { background: var(--tile2); border-radius: calc(14 * var(--u)); padding: calc(12 * var(--u)) calc(16 * var(--u)); white-space: pre-wrap; font-size: calc(21 * var(--u)); line-height: 1.35; }
  .msg.md pre code { background: none; padding: 0; font-size: inherit; }
  .msg.md blockquote { border-left: calc(4 * var(--u)) solid var(--dim); padding-left: calc(16 * var(--u)); color: var(--mute); }
  .msg.md a { color: inherit; text-decoration: underline; text-decoration-color: var(--dim); }
  .msg.md hr { border: 0; border-top: 1px solid var(--dim); margin: calc(10 * var(--u)) 0; }
  .empty { font-size: calc(24 * var(--u)); color: var(--mute); }

  .dock { position: fixed; left: calc(40 * var(--u)); right: calc(40 * var(--u)); bottom: calc(40 * var(--u)); z-index: 3; display: flex; gap: calc(16 * var(--u)); padding: calc(16 * var(--u)); border-radius: calc(40 * var(--u));
    background: rgba(22,22,22,.92); backdrop-filter: blur(calc(20 * var(--u))); opacity: 0; transform: translateY(calc(24 * var(--u))); transition: opacity .3s, transform .3s; pointer-events: none; }
  body.remote .dock { opacity: 1; transform: none; pointer-events: auto; }
  .dock button { flex: 1; height: calc(84 * var(--u)); border: 0; border-radius: calc(28 * var(--u)); background: var(--tile2); color: #fff; font: 700 calc(26 * var(--u)) "Manrope", sans-serif; }
  .dock button.on { box-shadow: inset 0 0 0 calc(3 * var(--u)) #fff; }
  .dock button.focus { background: #fff; color: #000; }

  /* pages: 1 = clock, weather, server, Claude; 2 = calendar, reminders, notes */
  .page { position: absolute; inset: 0; transition: opacity .7s ease; }
  .page.off { opacity: 0; pointer-events: none; }
  .dots { position: fixed; left: 50%; bottom: calc(14 * var(--u)); transform: translateX(-50%); display: flex; gap: calc(10 * var(--u)); z-index: 1; }
  .dots i { width: calc(8 * var(--u)); height: calc(8 * var(--u)); border-radius: calc(4 * var(--u)); background: var(--dim); transition: background .4s; }
  .dots i.on { background: #fff; }
  /* touch: swipe left/right between pages (vertical scrolling stays native) */
  html { touch-action: pan-y pinch-zoom; }
  .page.in-l { animation: in-l .32s ease-out; } .page.in-r { animation: in-r .32s ease-out; }
  @keyframes in-l { from { transform: translateX(calc(-60 * var(--u))); opacity: 0; } }
  @keyframes in-r { from { transform: translateX(calc(60 * var(--u))); opacity: 0; } }
  .tall { grid-row: span 2; }
  .agenda { gap: calc(6 * var(--u)); }
  .ag { flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: calc(26 * var(--u)); margin-top: calc(18 * var(--u));
        -webkit-mask-image: linear-gradient(#000 85%, transparent); }
  .ag-day h3 { font-size: calc(22 * var(--u)); font-weight: 700; color: var(--mute); text-transform: uppercase; letter-spacing: .08em; margin-bottom: calc(12 * var(--u)); }
  .ev { display: grid; grid-template-columns: calc(6 * var(--u)) calc(130 * var(--u)) 1fr; gap: calc(18 * var(--u)); align-items: baseline; padding: calc(8 * var(--u)) 0; font-size: calc(28 * var(--u)); }
  .ev i { align-self: stretch; border-radius: calc(3 * var(--u)); }
  .ev .tm { color: var(--mute); font-size: calc(24 * var(--u)); font-variant-numeric: tabular-nums; }
  .ev .tt { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 500; }
  .ev .tt small { display: block; font-size: calc(20 * var(--u)); color: var(--mute); font-weight: 400; }
  .ev.now .tm { color: #fff; font-weight: 700; }
  .ev.past { opacity: .45; }
  .rems { columns: 2; column-gap: calc(40 * var(--u)); margin-top: calc(22 * var(--u)); flex: 1; min-height: 0; overflow: hidden; }
  .rm { break-inside: avoid; display: grid; grid-template-columns: calc(26 * var(--u)) 1fr; gap: calc(16 * var(--u)); align-items: start; padding: calc(7 * var(--u)) 0; font-size: calc(26 * var(--u)); }
  .rm b { width: calc(24 * var(--u)); height: calc(24 * var(--u)); border-radius: calc(12 * var(--u)); border: calc(3 * var(--u)) solid var(--c, #fff); margin-top: calc(5 * var(--u)); }
  .rm span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rm small { display: block; font-size: calc(19 * var(--u)); color: var(--mute); }
  .rm.overdue small { color: #ff9b85; }
  .notes { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: calc(40 * var(--u)); flex: 1; min-height: 0; }
  .note { min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: calc(12 * var(--u)); }
  .note .body { font-size: calc(24 * var(--u)); line-height: 1.45; white-space: pre-wrap; overflow: hidden; color: #e6e6e6;
                -webkit-mask-image: linear-gradient(#000 75%, transparent); }

  /* built pages (page builder, ~/.config/homelab/pages/*.json): same grid, generic tiles */
  .b-body { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
  .b-stat { justify-content: space-between; }
  .b-stat .b-body { justify-content: flex-end; gap: calc(10 * var(--u)); }
  .big { font-size: calc(118 * var(--u)); font-weight: 800; line-height: .9; letter-spacing: -.034em; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; }
  .big.alert { color: #ff9b85; }
  .tbl { width: 100%; border-collapse: collapse; table-layout: fixed; margin-top: calc(16 * var(--u)); font-size: calc(25 * var(--u)); font-variant-numeric: tabular-nums; }
  .tbl th { text-align: left; color: var(--mute); font-weight: 500; font-size: calc(20 * var(--u)); padding: 0 calc(12 * var(--u)) calc(10 * var(--u)) 0; }
  .tbl td { padding: calc(10 * var(--u)) calc(12 * var(--u)) calc(10 * var(--u)) 0; border-top: 1px solid #262626; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tbl .num { text-align: right; } .tbl tr.dim td { color: var(--mute); }
  .tile.stale .b-body, .tile.stale .head .sub { opacity: .4; } .tile.stale .big.alert { color: inherit; }
  .b-line .b-body svg { width: 100%; height: 100%; display: block; }
  .legend { display: flex; flex-wrap: wrap; gap: calc(4 * var(--u)) calc(22 * var(--u)); font-size: calc(20 * var(--u)); color: var(--mute); white-space: nowrap; }
  .legend i { display: inline-block; width: calc(22 * var(--u)); height: calc(4 * var(--u)); border-radius: 2px; margin-right: calc(9 * var(--u)); vertical-align: middle; }
  .bar { display: grid; grid-template-columns: calc(170 * var(--u)) 1fr calc(120 * var(--u)); gap: calc(16 * var(--u)); align-items: center; font-size: calc(24 * var(--u)); padding: calc(7 * var(--u)) 0; }
  .bar .trk { height: calc(14 * var(--u)); position: relative; } .bar .trk::before { content: ""; position: absolute; left: 50%; top: calc(-6 * var(--u)); bottom: calc(-6 * var(--u)); width: 2px; background: #333; }
  .bar .trk i { position: absolute; top: 0; bottom: 0; border-radius: calc(4 * var(--u)); background: #fff; }
  .bar span:last-child { text-align: right; font-variant-numeric: tabular-nums; color: var(--mute); }
  .b-text .b-body { font-size: calc(26 * var(--u)); line-height: 1.45; white-space: pre-wrap; margin-top: calc(18 * var(--u)); color: #e6e6e6; }
  .b-note { position: absolute; left: calc(48 * var(--u)); bottom: calc(12 * var(--u)); font-size: calc(18 * var(--u)); color: #ff9b85; white-space: nowrap; }

  #fire { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; background: #000; opacity: 0; pointer-events: none; transition: opacity .6s; z-index: 2; }
  body.fireplace #fire { opacity: 1; pointer-events: auto; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

  /* weather icon and play/pause glyph scale with the tile */
  #wicon svg { width: calc(64 * var(--u)); height: calc(64 * var(--u)); display: block; }
  .pp svg { width: 36%; height: 36%; }
  #u-probe { position: absolute; visibility: hidden; width: calc(100 * var(--u)); height: 0; }

  /* phones, tablets in portrait, short windows: one scrolling column (two from 600px wide) */
  @media (max-aspect-ratio: 1/1), (max-height: 500px) {
    :root { --u: clamp(0.55px, 100vw / 760, 0.85px); }
    html, body { height: auto; min-height: 100%; overflow-x: hidden; overflow-y: auto; cursor: auto; }
    .page { position: relative; inset: auto; transition: none; }
    .page.off { display: none; }
    .grid { height: auto; grid-template-columns: minmax(0, 1fr); grid-template-rows: none; grid-auto-rows: auto;
            padding: calc(24 * var(--u)) calc(24 * var(--u)) calc(72 * var(--u)); gap: calc(20 * var(--u)); }
    .grid > .tile { grid-column: auto !important; grid-row: auto !important; min-height: calc(300 * var(--u)); padding: calc(36 * var(--u)); }
    .head { flex-wrap: wrap; row-gap: calc(6 * var(--u)); }
    .clock-tile { min-height: 0; gap: calc(28 * var(--u)); }
    .clock { font-size: min(calc(290 * var(--u)), 25vw); }
    .weather { gap: calc(28 * var(--u)); }
    .music .cover { flex: none; aspect-ratio: 1; }
    .rings { margin: calc(28 * var(--u)) 0; }
    .ring .r { width: calc(150 * var(--u)); height: calc(150 * var(--u)); border-radius: 50%; }
    .ring .r b { width: calc(120 * var(--u)); height: calc(120 * var(--u)); border-radius: 50%; }
    .msgs { flex: none; max-height: calc(620 * var(--u)); }
    .ag { flex: none; -webkit-mask-image: none; }
    .rems { flex: none; columns: 1; }
    .notes { grid-auto-flow: row; gap: calc(36 * var(--u)); }
    .note .body { max-height: calc(640 * var(--u)); }
    .b-body { flex: none; }
    .b-line .b-body { height: calc(460 * var(--u)); }
    .b-note { position: static; padding: 0 calc(24 * var(--u)); white-space: normal; }
    .dock { left: calc(16 * var(--u)); right: calc(16 * var(--u)); bottom: calc(16 * var(--u)); }
    .dock button { height: calc(96 * var(--u)); font-size: calc(28 * var(--u)); }
  }
  @media (max-aspect-ratio: 1/1) and (min-width: 600px), (max-height: 500px) {
    .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .grid > .wide { grid-column: span 2 !important; }
  }
.cells{display:grid;gap:6px;height:100%;min-height:0;line-height:1.15}
.cell{border-radius:10px;padding:.35em .5em;display:flex;flex-direction:column;justify-content:center;min-width:0;overflow:hidden;background:#222}
.cell .cl{font-size:.8em;color:#cfcfcf;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell .cl svg{width:1.25em;height:1.25em;vertical-align:-.25em;margin-right:.35em}
.cell .cl .lv{display:inline-block;width:.45em;height:.45em;border-radius:50%;background:#ff5a4f;margin:0 .3em .1em -.15em}
.cell b{font-size:1.3em;font-weight:600;white-space:nowrap}
.cell .cs{font-size:.72em;color:#d8d8d8;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell.pos{background:#163d26}.cell.pos b{color:#7ee2a0}
.cell.neg{background:#47201f}.cell.neg b{color:#ff9a8f}
.cell.flat b{color:#bdbdbd}
/* page builder v3: tones, chips, status strip, mix rows, summary, heat, dense tables, grouped cells */
:root{--pos:#5ee08f;--neg:#ff8a7a;--warn:#ffc98a;--long:#8ab4ff;--short:#ffb86b}
.pos{color:var(--pos)}.neg{color:var(--neg)}.warn{color:var(--warn)}.mute{color:var(--mute)}.long{color:var(--long)}.short{color:var(--short)}
.chip{display:inline-block;padding:calc(5 * var(--u)) calc(14 * var(--u));border-radius:999px;font-size:calc(19 * var(--u));font-weight:700;white-space:nowrap;background:#2a2a2a;color:#b5b5b5}
.chip.good{background:#1f3d2b;color:#7ef0a8}.chip.long{background:#1e2b44;color:#a9c7ff}.chip.short{background:#3d3020;color:#ffc98a}.chip.warn{background:#3d3020;color:#ffc98a}.chip.bad{background:#3d2220;color:#ffa396}
.grid.has-strip{grid-template-rows:auto repeat(2,minmax(0,1fr))}
.strip{grid-column:1/-1;background:var(--tile);border-radius:calc(32 * var(--u));padding:calc(24 * var(--u)) calc(40 * var(--u));display:flex;align-items:center;gap:calc(20 * var(--u));font-size:calc(24 * var(--u));white-space:nowrap;overflow:hidden;font-variant-numeric:tabular-nums}
.strip .sd{width:calc(16 * var(--u));height:calc(16 * var(--u));border-radius:50%;background:var(--pos);flex:none}
.strip .sd.warn{background:var(--warn)}.strip .sd.bad{background:var(--neg)}
.strip .st{font-size:calc(30 * var(--u));font-weight:800}.strip .sm{color:var(--mute)}.strip b{font-weight:800}
.strip .sgs{margin-left:auto;display:flex;gap:calc(40 * var(--u))}.strip .sg{display:flex;gap:calc(8 * var(--u))}
.mix{display:flex;flex-direction:column;justify-content:space-between;flex:1;min-height:0;gap:calc(6 * var(--u));margin-top:calc(10 * var(--u))}
.mix-h,.mix-r{display:grid;grid-template-columns:calc(220 * var(--u)) minmax(0,1fr) calc(120 * var(--u)) calc(250 * var(--u));column-gap:calc(18 * var(--u));align-items:center}
.mix-h{font-size:calc(16 * var(--u));color:var(--mute);text-transform:uppercase;letter-spacing:.08em}
.mix-h span:nth-child(n+3),.mix-r .mv,.mix-r .mb{text-align:right}
.mix-r .mn{font-size:calc(23 * var(--u));font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mix-r .md,.mix-r .mc{font-size:calc(17 * var(--u));color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mix-r .mc{margin-top:calc(5 * var(--u))}.mix-r .chip{font-size:calc(16 * var(--u));padding:calc(4 * var(--u)) calc(12 * var(--u))}
.mix-r .mv{font-size:calc(28 * var(--u));font-weight:800;font-variant-numeric:tabular-nums}
.seg{display:flex;height:calc(14 * var(--u));border-radius:calc(7 * var(--u));overflow:hidden;gap:calc(3 * var(--u));background:#2a2a2a}
.seg i{display:block}.seg i.pos{background:var(--pos)}.seg i.neg{background:var(--neg)}.seg i.idle{background:#3a3a3a}
.row.has-d span:first-child{display:block;-webkit-line-clamp:unset;font-weight:700}
.row.has-d span:only-child{max-width:none;white-space:normal;text-align:left;color:#fff;font-size:calc(24 * var(--u))}

.tbl.dense td{padding:calc(3 * var(--u)) calc(10 * var(--u)) calc(3 * var(--u)) 0;border-top:0}
.tbl td.pos{color:var(--pos);font-weight:700}.tbl td.neg{color:var(--neg);font-weight:700}
.tbl tr.grp td{padding-top:calc(16 * var(--u));border-top:0}

.tbl .gh{display:flex;align-items:center;gap:calc(14 * var(--u));padding-bottom:calc(6 * var(--u));border-bottom:2px solid #2a2a2a;font-weight:400}
.tbl .gh b{font-size:calc(24 * var(--u));font-weight:800;color:#fff}.tbl .gh .mute{font-size:calc(18 * var(--u));overflow:hidden;text-overflow:ellipsis}.tbl .gh .chip{margin-left:auto;font-size:calc(17 * var(--u))}
.tbl tr.tnote td{white-space:normal;color:var(--mute);font-size:calc(18 * var(--u));line-height:1.45;padding-top:calc(6 * var(--u))}

.tbl small{color:var(--mute);font-size:.8em;font-weight:500;margin-left:.4em}
.tbl td .chip{font-size:calc(16 * var(--u));padding:calc(1 * var(--u)) calc(10 * var(--u));border-radius:calc(8 * var(--u))}
.dbar{position:relative;height:calc(14 * var(--u))}
.dbar::before{content:"";position:absolute;left:50%;top:calc(-5 * var(--u));bottom:calc(-5 * var(--u));width:2px;background:#3a3a3a}
.dbar i,.hbar i{position:absolute;top:0;bottom:0;border-radius:calc(3 * var(--u))}
.dbar i.pos{background:var(--pos)}.dbar i.neg{background:var(--neg)}
.hbar{position:relative;height:calc(12 * var(--u));background:#222;border-radius:calc(6 * var(--u));overflow:hidden}.hbar i{left:0;background:#6f6f6f}

.csh b{font-size:calc(18 * var(--u));font-weight:800;text-transform:uppercase;letter-spacing:.08em}.csh span{font-size:calc(18 * var(--u));color:var(--mute)}
.cgrid{display:grid;gap:calc(8 * var(--u))}

.csec .cell b{color:#fff;font-weight:800}.csec .cell .cl{display:flex;align-items:center;color:#fff;font-weight:700}
.csec .cell .ro{margin-left:auto;flex:none;width:.5em;height:.5em;border-radius:50%;border:2px solid #fff}
.wchips{display:flex;flex-wrap:wrap;gap:calc(6 * var(--u))}
.wchips span{padding:calc(4 * var(--u)) calc(10 * var(--u));border-radius:calc(8 * var(--u));background:#222;color:var(--mute);font-size:calc(16 * var(--u));font-weight:600;white-space:nowrap}

</head>
<body>
<div class="grid page" id="p1" data-page="1">
  <section class="tile wide clock-tile">
    <div class="date" id="date"></div>
    <div class="clock" id="time">--:--</div>
  </section>

  <section class="tile weather">
    <div class="head"><div class="title" id="wname">Weather</div><span id="wicon"></span></div>
    <div class="temp" id="wt">--°</div>
    <div><div class="cond" id="wc">Loading weather</div><div class="sub" id="ws"></div></div>
  </section>

  <section class="tile music" id="music" style="display:none">
    <div class="cover" id="cover"></div>
    <div class="track">
      <div><div class="t-name" id="tname"></div><div class="t-artist" id="tartist"></div></div>
      <div class="pp" id="pp"></div>
    </div>
    <div class="prog"><i id="tprog" style="width:0"></i></div>
  </section>
  <section class="tile" id="forecast">
    <div class="head"><div class="title">Next days</div><div class="sub" id="sunset"></div></div>
    <div class="days" id="days"></div>
  </section>

  <section class="tile server">
    <div class="head"><div class="title">Server</div><div class="sub" id="up"></div></div>
    <div class="rings" id="rings"></div>
    <div class="sub" id="sysline"></div>
  </section>

  <section class="tile">
    <div class="head"><div class="title">Home</div><div class="sub" id="wifi"></div></div>
    <div class="list" id="home"></div>
  </section>

  <section class="tile wide claude" id="claude">
    <div class="head" style="justify-content:flex-start; gap:calc(14 * var(--u))"><span class="dot"></span><div class="title">Claude</div><div class="sub" id="cs">no active session</div></div>
    <div class="msgs" id="msgs"><div class="empty">Start a homelab session in the Claude app and the conversation shows up here.</div></div>
  </section>
</div>

<div class="grid page off" id="p2" data-page="2">
  <section class="tile wide tall agenda">
    <div class="head"><div class="title">Calendar</div><div class="sub" id="ag-upd"></div></div>
    <div class="ag" id="ag"><div class="empty">Waiting for the first snapshot from your Mac (clients/macos).</div></div>
  </section>
  <section class="tile wide">
    <div class="head"><div class="title">Reminders</div><div class="sub" id="rem-n"></div></div>
    <div class="rems" id="rem"></div>
  </section>
  <section class="tile wide"><div class="notes" id="notes"></div></section>
</div>
<div id="built"></div>
<i id="u-probe"></i>
<div class="dots" id="dots" hidden></div>

<nav class="dock">
  <button data-mode="dashboard">Dashboard</button>
  <button data-mode="fireplace">Fireplace</button>
  <button data-mode="youtube">YouTube</button>
  <button data-screen="off">Screen off</button>
</nav>
<video id="fire" src="/media/fireplace.mp4" loop playsinline preload="auto"></video>

<script>
const $ = id => document.getElementById(id);
// /settings on the control server edits these (config/settings.json); reloaded every minute
let CFG = {location_name: "", latitude: null, longitude: null, timezone: "", probe_label: "", host: ""};
async function config() {
  try {
    const prev = JSON.stringify([CFG.latitude, CFG.longitude, CFG.timezone]);
    CFG = await (await fetch("/api/config")).json();
    $("wname").textContent = CFG.location_name || "Weather";
    if (CFG.host) document.title = `Dashboard · ${CFG.host}`;
    if (JSON.stringify([CFG.latitude, CFG.longitude, CFG.timezone]) !== prev) weather();
  } catch (e) {}
}
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[c]);
/* tiny markdown for Claude messages: escape first, then format (no raw HTML gets through) */
const mdInline = t => t
  .replace(/`([^`\n]+)`/g, (_, c) => "\u0000" + c + "\u0001")
  .replace(/\*\*([^*\n]+)\*\*|__([^_\n]+)__/g, (_, a, b) => `<strong>${a || b}</strong>`)
  .replace(/(^|[^*\w])\*([^*\n]+)\*(?!\w)|(^|[^_\w])_([^_\n]+)_(?!\w)/g, (_, p1, a, p2, b) => `${p1 ?? p2}<em>${a ?? b}</em>`)
  .replace(/\[([^\]\n]+)\]\((https?:[^)\s]+)\)/g, "<a>$1</a>")
  .replace(/\u0000([^\u0001]*)\u0001/g, "<code>$1</code>");
function md(src) {
  const out = [], lines = esc(src).split("\n");
  let list = null, para = [];
  const flush = () => { if (para.length) out.push(`<p>${mdInline(para.join("<br>"))}</p>`); para = [];
    if (list) out.push(`<${list.tag}>${list.items.map(i => `<li>${mdInline(i)}</li>`).join("")}</${list.tag}>`); list = null; };
  for (let i = 0; i < lines.length; i++) {
    const l = lines[i];
    if (/^\s*```/.test(l)) { flush(); const code = []; while (++i < lines.length && !/^\s*```/.test(lines[i])) code.push(lines[i]);
      out.push(`<pre><code>${code.join("\n")}</code></pre>`); continue; }
    let m;
    if (!l.trim()) { flush(); continue; }
    if ((m = l.match(/^#{1,6}\s+(.*)/))) { flush(); out.push(`<h4>${mdInline(m[1])}</h4>`); continue; }
    if (/^\s*([-*_])(\s*\1){2,}\s*$/.test(l)) { flush(); out.push("<hr>"); continue; }
    if ((m = l.match(/^&gt;\s?(.*)/))) { flush(); out.push(`<blockquote>${mdInline(m[1])}</blockquote>`); continue; }
    if ((m = l.match(/^\s*(?:([-*+])|(\d+)[.)])\s+(.*)/))) {
      const tag = m[1] ? "ul" : "ol";
      if (para.length || (list && list.tag !== tag)) flush();
      (list ??= {tag, items: []}).items.push(m[3]); continue; }
    if (list && /^\s{2,}\S/.test(l)) { list.items[list.items.length - 1] += " " + l.trim(); continue; }
    if (list) flush();
    para.push(l);
  }
  flush();
  return out.join("");
}
const WMO = {0:"Clear",1:"Mostly clear",2:"Partly cloudy",3:"Overcast",45:"Fog",48:"Rime fog",51:"Light drizzle",53:"Drizzle",55:"Heavy drizzle",56:"Freezing drizzle",57:"Freezing drizzle",61:"Light rain",63:"Rain",65:"Heavy rain",66:"Freezing rain",67:"Freezing rain",71:"Light snow",73:"Snow",75:"Heavy snow",77:"Snow grains",80:"Showers",81:"Showers",82:"Heavy showers",85:"Snow showers",86:"Heavy snow showers",95:"Thunderstorm",96:"Thunderstorm, hail",99:"Thunderstorm, hail"};
const S = 'fill="none" stroke="#fff" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"';
const ICON = {
  sun: `<svg width="64" height="64" viewBox="0 0 24 24" ${S} aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>`,
  moon: `<svg width="64" height="64" viewBox="0 0 24 24" ${S} aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>`,
  part: `<svg width="64" height="64" viewBox="0 0 24 24" ${S} aria-hidden="true"><circle cx="9" cy="9" r="3.2"/><path d="M9 2.5v1.3M2.5 9h1.3M4.4 4.4l.9.9M14.2 9h1.3M13.6 4.4l-.9.9"/><path d="M19 20H10a3.4 3.4 0 1 1 .9-6.7A4.3 4.3 0 0 1 19.4 14 3 3 0 0 1 19 20z"/></svg>`,
  cloud: `<svg width="64" height="64" viewBox="0 0 24 24" ${S} aria-hidden="true"><path d="M17 18H7a4 4 0 1 1 1-7.9A5 5 0 0 1 17.5 9 4.5 4.5 0 0 1 17 18z"/></svg>`,
  rain: `<svg width="64" height="64" viewBox="0 0 24 24" ${S} aria-hidden="true"><path d="M17 14H7a4 4 0 1 1 1-7.9A5 5 0 0 1 17.5 5 4.5 4.5 0 0 1 17 14z"/><path d="M8 17l-1 3M12 17l-1 3M16 17l-1 3"/></svg>`,
  snow: `<svg width="64" height="64" viewBox="0 0 24 24" ${S} aria-hidden="true"><path d="M17 14H7a4 4 0 1 1 1-7.9A5 5 0 0 1 17.5 5 4.5 4.5 0 0 1 17 14z"/><path d="M8 18h.01M12 19h.01M16 18h.01M10 21h.01M14 21h.01"/></svg>`,
};
const iconFor = (c, day) => c <= 1 ? (day ? ICON.sun : ICON.moon) : c === 2 ? ICON.part : c <= 48 ? ICON.cloud : (c >= 71 && c <= 77) || c === 85 || c === 86 ? ICON.snow : ICON.rain;

function clock() {
  const d = new Date();
  $("time").textContent = d.toLocaleTimeString("en-GB", {hour: "2-digit", minute: "2-digit"});
  $("date").textContent = d.toLocaleDateString("en-GB", {weekday: "long", day: "numeric", month: "long"});
}

async function weather() {
  if (CFG.latitude == null) return;
  try {
    const w = await (await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${CFG.latitude}&longitude=${CFG.longitude}&current=temperature_2m,apparent_temperature,weather_code,is_day&daily=temperature_2m_max,temperature_2m_min,sunset&forecast_days=5&timezone=${encodeURIComponent(CFG.timezone || "auto")}`)).json();
    const c = w.current;
    $("wt").textContent = Math.round(c.temperature_2m) + "°";
    $("wc").textContent = WMO[c.weather_code] || "";
    $("ws").textContent = `Low ${Math.round(w.daily.temperature_2m_min[0])}°, high ${Math.round(w.daily.temperature_2m_max[0])}°`;
    $("wicon").innerHTML = iconFor(c.weather_code, c.is_day);
    $("sunset").textContent = "Sunset " + w.daily.sunset[0].slice(11, 16);
    const lo = Math.min(...w.daily.temperature_2m_min), hi = Math.max(...w.daily.temperature_2m_max), span = hi - lo || 1;
    $("days").innerHTML = w.daily.time.map((d, i) => {
      const a = (w.daily.temperature_2m_min[i] - lo) / span * 100, b = (w.daily.temperature_2m_max[i] - lo) / span * 100;
      const n = i === 0 ? "Today" : new Date(d).toLocaleDateString("en-GB", {weekday: "long"});
      return `<div class="day"><span>${n}</span><div class="range"><i style="left:${a}%;right:${100 - b}%"></i></div><span>${Math.round(w.daily.temperature_2m_max[i])}°</span></div>`;
    }).join("");
  } catch (e) { $("wc").textContent = "Weather unavailable"; }
}

const ring = (label, pct) => `<div class="ring"><div class="r" style="background:conic-gradient(#fff ${pct}%, #2e2e2e 0)"><b>${Math.round(pct)}%</b></div>${label}</div>`;
async function stats() {
  try {
    const s = await (await fetch("/api/stats")).json();
    const cpu = Math.min(100, s.load[0] / s.cpus * 100);
    $("rings").innerHTML = ring("CPU", cpu) + ring("Memory", s.mem_used / s.mem_total * 100) + ring("Disk", s.disk_used / s.disk_total * 100);
    const h = Math.floor(s.uptime / 3600);
    $("up").textContent = "up " + (h >= 24 ? Math.floor(h / 24) + "d " + (h % 24) + "h" : h + "h " + Math.floor(s.uptime % 3600 / 60) + "m");
    const bat = {Charging: "charging", Discharging: "on battery", Full: "full", "Not charging": "plugged in"}[s.battery_status] || "";
    $("sysline").textContent = [s.temp ? Math.round(s.temp) + "°C" : null, s.battery ? `battery ${s.battery}% ${bat}` : null, s.ping != null ? `ping ${Math.round(s.ping)} ms` : "offline"].filter(Boolean).join(", ");
    $("wifi").textContent = s.lan_devices != null ? `${s.lan_devices} on Wi-Fi` : "";
    const rows = [
      ...(s.tailscale || []).map(d => [d.name, d.online ? "online" : "offline", d.online]),
      ...(s.bluetooth || []).map(b => [b, "connected", true]),
      ...(CFG.probe_label ? [[CFG.probe_label, s.site == null ? "checking" : s.site ? "online" : "unreachable", !!s.site]] : []),
      ...s.containers.filter(([n]) => !/hello/.test(n)).map(([n, st]) => [n, st.startsWith("Up") ? "running" : "stopped", st.startsWith("Up")]),
    ].slice(0, 6);
    $("home").innerHTML = rows.map(([n, st, ok]) => `<div class="row ${ok ? "" : "off"}"><span>${esc(n)}</span><span>${esc(st)}</span></div>`).join("");
    setActive(s.state.mode);
    if (s.state.page && s.state.page !== lock) window.setPage(s.state.page);
  } catch (e) {}
}

const toSec = t => (t || "").split(":").reduce((a, v) => a * 60 + (+v || 0), 0);
async function music() {
  try {
    const m = await (await fetch("/api/spotify")).json();
    $("music").style.display = m.active ? "" : "none";
    $("forecast").style.display = m.active ? "none" : "";
    if (!m.active) return;
    $("cover").style.backgroundImage = m.cover ? `url("${m.cover.replace(/"/g, "")}")` : "none";
    $("tname").textContent = m.title || "";
    $("tartist").textContent = m.artists || "";
    $("pp").innerHTML = m.playing
      ? '<svg width="22" height="22" viewBox="0 0 24 24" fill="#000" aria-hidden="true"><rect x="5" y="4" width="5" height="16" rx="1"/><rect x="14" y="4" width="5" height="16" rx="1"/></svg>'
      : '<svg width="24" height="24" viewBox="0 0 24 24" fill="#000" aria-hidden="true"><path d="M7 4l13 8-13 8z"/></svg>';
    const d = toSec(m.duration); $("tprog").style.width = d ? (toSec(m.position) / d * 100) + "%" : "0";
  } catch (e) {}
}

async function claude() {
  try {
    const c = await (await fetch("/api/claude")).json();
    $("claude").classList.toggle("live", !!c.live);
    if (!c.messages || !c.messages.length) return;
    const ago = Math.round((Date.now() - new Date(c.updated)) / 60000);
    $("cs").textContent = c.live ? `working on ${CFG.host || "the server"}` : ago < 1 ? "just now" : ago < 60 ? `${ago} min ago` : "session ended";
    $("msgs").innerHTML = c.messages.slice(-6).map(m => m.role === "assistant" ? `<div class="msg md ${m.role}">${md(m.text)}</div>` : `<div class="msg ${m.role}">${esc(m.text)}</div>`).join("");
  } catch (e) {}
}

/* modes + remote: HomeKit remote (via screenctl), air mouse or the laptop keyboard */
const fire = $("fire"), buttons = [...document.querySelectorAll(".dock button")];
let focus = -1, remoteTimer = 0, mode = "dashboard";
function setActive(m) { mode = m; buttons.forEach(b => b.classList.toggle("on", b.dataset.mode === m)); }
function paint() { buttons.forEach((b, i) => b.classList.toggle("focus", i === focus)); }
function activate(b) { fetch(b.dataset.mode ? "/api/mode/" + b.dataset.mode : "/api/screen/" + b.dataset.screen, {method: "POST"}); }
window.setMode = m => {
  document.body.classList.toggle("fireplace", m === "fireplace");
  if (m === "fireplace") fire.play().catch(() => {}); else setTimeout(() => fire.pause(), 700);
  setActive(m); focus = -1; paint(); document.body.classList.remove("remote");
};
window.remote = key => {
  if (focus < 0 && mode === "dashboard" && (key === "left" || key === "right") && (avail().length > 1 || lock !== "auto")) {

      ? `<tr class="tnote"><td colspan="${n}">${r.label ? `<span class="chip">${esc(r.label)}</span>` : ""}${esc(r.text || "")}</td></tr>`

function summaryHtml(d, t) {      // any of: kpis, big (+ sub), split bar, list, mini table (tile columns + d.rows)
  let h = "";
  if (d.kpis) h += `<div class="kp">${d.kpis.map(k => `<div style="min-width:0"><div class="kv ${tn(k.tone)}">${esc(k.value)}</div><div class="kl">${esc(k.label || "")}</div></div>`).join("")}</div>`;
  if (d.big != null) h += `<div><div class="sb ${tn(d.big_tone)}">${esc(d.big)}</div>${d.big_sub ? `<div class="bs">${esc(d.big_sub)}</div>` : ""}</div>`;
  if (d.split) {
    const a = d.split.a || {}, b = d.split.b || {}, pa = Math.max(0, Math.min(100, +a.pct || 0));
    h += `<div><div class="sl"><span>${esc(a.label || "")}</span><span>${esc(b.label || "")}</span></div>`
      + `<div class="sbar"><i class="${tn(a.tone || "long")}" style="width:${pa}%"></i><i class="${tn(b.tone || "short")}" style="width:${100 - pa}%"></i></div>`
      + (d.split.note ? `<div class="sn">${esc(d.split.note)}</div>` : "") + `</div>`;
  }
  if (d.list && d.list.length) h += `<div class="${d.rows ? "" : "push"}">${d.list_title ? `<div class="lt">${esc(d.list_title)}</div>` : ""}`
    + d.list.map(r => `<div class="li"><span>${esc(r.name)}</span><span class="${tn(r.tone)}">${esc(fmt(r.value, r.format, r.digits))}</span></div>`).join("") + `</div>`;
  if (d.rows && t.columns) h += d.rows.length ? tableHtml(t.columns, d.rows.slice(0, t.max || 8), t) : `<div class="empty">${esc(t.empty || "Nothing to show.")}</div>`;

function heatHtml(d, t) {         // {cols: [...], rows: [{label, sub, cells: [{value, sub, ret}]}], max?}
  const cols = d.cols || [], rows = d.rows || [];

    + cols.map(c => `<span class="hc">${esc(c)}</span>`).join("")
    + rows.map(r => `<span class="hl">${esc(r.label)}${r.sub ? `<small>${esc(r.sub)}</small>` : ""}</span>`
      + cols.map((_, i) => { const c = (r.cells || [])[i];
        return c ? `<div class="hx" style="background:${shadeBg(c.ret, max)}${hh}"><b>${esc(c.value)}</b><span>${esc(c.sub || "")}</span></div>` : `<div class="hx" style="${hh.slice(1)}"><span>–</span></div>`; }).join("")).join("")

function cellSections(secs, t) {  // [{name, summary, cells: [{label, value, sub, ret, open, icon, live}], waiting: [label]}]
  if (!secs.length) return `<div class="empty">${esc(t.empty || "Nothing to show.")}</div>`;

  return `<div class="csecs">` + secs.map(s => {

      + (cells.length ? `<div class="cgrid" style="grid-template-columns:repeat(${n},calc(${cw} * var(--u)))">` + cells.map(r =>
        `<div class="cell" style="background:${shadeBg(r.ret, max)}"><span class="cl">${cellIcon(r)}<span style="overflow:hidden;text-overflow:ellipsis">${esc(r.label)}</span>${r.open ? '<span class="ro" title="position open"></span>' : ""}</span>`
        + `<b>${esc(fmt(r.value, t.format || "num", t.digits ?? 0))}</b>${r.sub != null && r.sub !== "" ? `<span class="cs">${esc(r.sub)}</span>` : ""}</div>`).join("") + `</div>` : "")
      + ((s.waiting || []).length ? `<div class="wchips" style="max-width:max(${gw}, calc(260 * var(--u)))">${s.waiting.map(w => `<span>${esc(w)}</span>`).join("")}</div>` : "")

}
function stripHtml(d) {           // {tone, title, text, groups: [[{value, label, tone}]], right}
  if (!d) return "";

    + (d.groups || []).map(g => `<span class="sg">${g.map(i => `<span><b class="${tn(i.tone)}">${esc(i.value)}</b> <span class="sm">${esc(i.label || "")}</span></span>`).join('<span class="sm">·</span>')}</span>`).join("")
    + (d.right ? `<span class="sm">${esc(d.right)}</span>` : "") + `</div>`;

// cells tile: broker icons by name (no user-supplied SVG is ever inserted, only these constants)
const CELL_ICONS = {
  paper: '<svg viewBox="0 0 16 16" aria-label="paper"><path d="M2.8 1h7.1l3.3 3.3V15H2.8z" fill="none" stroke="#b5b5b5" stroke-width="1.7" stroke-linejoin="round"/><path d="M9.6 1.2v3.4h3.4M5.3 8.3h5.4M5.3 11.4h5.4" fill="none" stroke="#b5b5b5" stroke-width="1.5" stroke-linecap="round"/></svg>',
  bybit: '<svg viewBox="0 0 16 16" aria-label="Bybit"><rect x="1" y="1" width="14" height="14" rx="3.5" fill="#f7a600"/><path d="M5.6 4h3.1c1.5 0 2.3.7 2.3 1.8 0 .8-.4 1.3-1 1.6.9.3 1.4.9 1.4 1.8 0 1.4-1 2.3-2.7 2.3H5.6zm1.6 3.1h1.3c.6 0 .9-.3.9-.8s-.3-.8-.9-.8H7.2zm0 3.2h1.5c.7 0 1-.3 1-.9s-.4-.9-1-.9H7.2z" fill="#121212"/></svg>',

  mexc: '<svg viewBox="0 0 16 16" aria-label="MEXC"><rect x="1" y="1" width="14" height="14" rx="3.5" fill="#1972e2"/><path d="M4 11.5V4.5h1.6L8 8l2.4-3.5H12v7h-1.6V7.2L8 10.6 5.6 7.2v4.3z" fill="#fff"/></svg>',
  unknown: '<svg viewBox="0 0 16 16" aria-label="unknown broker"><circle cx="8" cy="8" r="6.3" fill="none" stroke="#8a8a8a" stroke-width="1.4"/><path d="M6.3 6.3a1.8 1.8 0 1 1 2.6 1.6c-.6.3-.9.7-.9 1.3v.4" fill="none" stroke="#8a8a8a" stroke-width="1.3" stroke-linecap="round"/><circle cx="8" cy="11.4" r=".8" fill="#8a8a8a"/></svg>',
};
function cellIcon(r) {
  const svg = r && r.icon ? (CELL_ICONS[r.icon] || CELL_ICONS.unknown) : "";
  return svg + (r && r.live ? '<i class="lv" title="live"></i>' : "");
}
function buildPages() {
  $("built").innerHTML = PAGES.filter(p => !p.builtin).map(p => `<div class="grid page off${p.strip ? " has-strip" : ""}" data-page="${esc(p.id)}">`
    + (p.strip ? `<section class="strip" data-strip></section>` : "")
    + p.tiles.map((t, i) => `<section class="tile b-${esc(t.type)}${clamp(t.w, 1, 4) >= 2 ? " wide" : ""}" style="grid-column:span ${clamp(t.w, 1, 4)};grid-row:span ${clamp(t.h, 1, 2)}" data-tile="${i}">`
      + `<div class="head"><div class="title">${esc(t.title || "")}</div><div class="sub" data-sub></div></div><div class="b-body" data-body></div></section>`).join("")
    + `<div class="b-note" data-note></div></div>`).join("");
  for (const p of PAGES.filter(p => !p.builtin)) BUILT[p.id] = {page: p, data: (BUILT[p.id] || {}).data || null, at: 0};
  for (const id of Object.keys(BUILT)) if (!PAGES.some(p => p.id === id)) delete BUILT[id];
  showPage(lock !== "auto" ? lock : avail().includes(page) ? page : "1");
}
function renderBuilt(id) {
  const b = BUILT[id], el = document.querySelector(`.page[data-page="${id}"]`);
  if (!b || !el) return;
  const data = b.data || {};
  b.page.tiles.forEach((t, i) => {
    const tile = el.querySelector(`[data-tile="${i}"]`), body = tile.querySelector("[data-body]");
    const sub = t.type === "line" && (get(data, t.field)?.series || []).length > 1
      ? `<div class="legend">${get(data, t.field).series.map((s, j) => `<span><i style="background:${esc(s.color || SERIES[j % SERIES.length])}"></i>${esc(s.name)}</span>`).join("")}</div>`
      : esc(t.head_field ? fmt(get(data, t.head_field), t.head_format) : t.head || "");
    tile.querySelector("[data-sub]").innerHTML = sub;
    tile.classList.toggle("stale", !!(t.dim_field && get(data, t.dim_field)));   // dim_field: grey out old data
    const foot = t.foot_field ? get(data, t.foot_field) : null;
    body.innerHTML = b.data ? tileHtml(t, data, body) + (foot ? `<div class="b-foot">${esc(foot)}</div>` : "") : '<div class="empty">Loading…</div>';
    for (const big of body.querySelectorAll(".big")) {
      const k = U(); let fs = 118; big.style.fontSize = fs * k + "px";
      while (big.scrollWidth > big.clientWidth && fs > 36) { fs -= 6; big.style.fontSize = fs * k + "px"; }
    }
  });
  const strip = el.querySelector("[data-strip]");
  if (strip) strip.innerHTML = b.data ? stripHtml(get(data, b.page.strip.field)) : "";
  el.querySelector("[data-note]").textContent = data._error ? "source error: " + data._error : "";
}
async function loadBuilt(id) {
  const b = BUILT[id]; if (!b) return;
  b.at = Date.now();
  try { b.data = await (await fetch("/api/pages/" + encodeURIComponent(id))).json(); } catch (e) { return; }
  if (page === id) renderBuilt(id);
}
async function pages() {
  try {
    const r = await (await fetch("/api/pages")).json();
    const sig = JSON.stringify(r.pages);
    if (sig === pagesSig) return;
    pagesSig = sig; PAGES = r.pages; buildPages();
  } catch (e) {}
}
setInterval(() => {   // the visible built page: refresh its data on schedule, re-render every second (countdowns)
  const b = BUILT[page];
  if (!b || mode !== "dashboard") return;
  if (Date.now() - b.at > b.page.refresh * 1000) loadBuilt(page); else renderBuilt(page);
}, 1000);

clock(); config(); stats(); music(); claude(); agenda(); pages();
setInterval(agenda, 30000); setInterval(pages, 60000);
setInterval(config, 60000); setInterval(clock, 1000); setInterval(stats, 3000); setInterval(music, 2000); setInterval(claude, 2000); setInterval(weather, 15 * 60000);
