# Spotify Connect receiver: shows up under device_name in the Spotify app (LAN discovery, no stored password).
[global]
device_name = "homelab"
device_type = "speaker"
backend = "pulseaudio"
bitrate = 320
volume_normalisation = true
initial_volume = 60
zeroconf_port = 4070
max_cache_size = 1000000000
on_song_change_hook = "/srv/homelab/spotify/hook.sh"
